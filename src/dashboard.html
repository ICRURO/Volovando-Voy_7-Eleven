<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Volovando Voy - Dashboard</title>
  <link rel="stylesheet" href="../assets/css/global.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; width: 100vw; overflow: hidden; font-family: Arial, sans-serif; background-color: #f6f3ed; }
    .sidebar { width: 250px; min-width: 250px; background-color: #8b1818; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; color: white; }
    .sidebar h1 { font-size: 1.4rem; text-align: center; margin-bottom: 1rem; font-weight: 800; }
    .sidebar img { width: 90px; margin-bottom: 2rem; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 0.8rem; width: 100%; }
    .nav-btn { background: none; border: none; color: #ffffff; text-align: left; font-size: 0.95rem; font-weight: bold; padding: 0.75rem 1rem; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
    .nav-btn:hover, .nav-btn.active { background-color: rgba(255, 255, 255, 0.2); }
    .logout-btn { margin-top: auto; background-color: #d32f2f; text-align: center; justify-content: center; }
    .main-content { flex: 1; height: 100%; }
    #content-frame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <h1>VOLOVANDO<br>VOY</h1>
    <img src="../assets/volovino.png" alt="Mascota">

    <nav class="sidebar-nav">
      <button id="btn-home" class="nav-btn active" onclick="loadModule('welcome.html', this)">HOME</button>
      
      <button class="nav-btn only-admin" onclick="loadModule('modules/pos/pos.html', this)">MENÚ / VENTAS</button>
      <button class="nav-btn only-admin" onclick="loadModule('modules/inventory/inventory.html', this)">INVENTARIO</button>
      <button class="nav-btn only-admin" onclick="alert('Módulo de pedidos en desarrollo')">PEDIDOS</button>
      <button class="nav-btn only-admin" onclick="loadModule('modules/clients/clients.html', this)">CLIENTES</button>
      <button class="nav-btn only-admin" onclick="loadModule('/shifts/admin', this)">TURNOS Y EMPLEADOS</button>
      <button class="nav-btn only-admin" onclick="loadModule('modules/reports/reports.html', this)">REPORTES</button>

      <button class="nav-btn logout-btn" onclick="logout()">CERRAR SESIÓN</button>
    </nav>
  </aside>

  <main class="main-content">
    <!-- El iframe ahora carga welcome.html por defecto -->
    <iframe id="content-frame" src="welcome.html"></iframe>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const frame = document.getElementById('content-frame');

      try {
        const res = await fetch('/api/auth/session');
        
        if (!res.ok) {
          window.location.href = '/login';
          return;
        }

        const usuario = await res.json();

        // Ocultar botones de admin si es empleado, pero mantener a ambos en el "HOME"
        if (usuario.rol === 'empleado') {
          document.querySelectorAll('.only-admin').forEach(btn => btn.style.display = 'none');
          if (frame) frame.src = 'modules/shifts/shifts_employee.html';
        } else {
          document.querySelectorAll('.only-admin').forEach(btn => btn.style.display = 'block');
        }
      } catch (error) {
        console.error("Error al consultar sesión del servidor.");
      }
    });

    function loadModule(url, btn) {
      document.getElementById('content-frame').src = url;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
    }

    function logout() {
      localStorage.clear();
      window.location.href = "../index.html"; 
    }
  </script>
</body>
</html>
