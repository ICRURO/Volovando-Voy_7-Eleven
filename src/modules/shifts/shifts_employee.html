<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Turno y Caja</title>
    <link rel="stylesheet" href="/shifts.css">
</head>
<body>

    <div class="shifts-container">
        
        <div class="card">
            <h2 class="card-title">REGISTRO DE ENTRADA / SALIDA</h2>

            <!-- Banner para mostrar quién está en sesión -->
            <div class="user-info-banner" style="margin-bottom: 1rem; font-weight: bold; color: #8b1818;">
                Empleado: <span id="label-empleado">Cargando...</span>
            </div>

            <div class="form-group">
                <label for="monto_caja">Monto de Efectivo ($):</label>
                <input type="number" id="monto_caja" placeholder="Ej. 500.00" min="0" step="0.01">
                <small class="field-hint">Ingrese fondo inicial para ABRIR o el conteo final para CERRAR.</small>
            </div>

            <!-- BOTONES DINÁMICOS -->
            <button type="button" id="btn-abrir" class="btn-primary">Abrir Turno / Entrar</button>
            <button type="button" id="btn-cerrar" class="btn-danger" style="margin-top: 0.8rem;" disabled>Cerrar Turno / Salir</button>

            <!-- Alerta para mensajes -->
            <div id="mensaje-operacion" class="alert hidden"></div>
        </div>

    </div>

    <script src="/shifts_employee.js"></script>
</body>
</html>
