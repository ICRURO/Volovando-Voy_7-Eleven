<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportes - Volovando Voy</title>
    <link rel="stylesheet" href="../../assets/css/global.css">
    <link rel="stylesheet" href="reports.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Contenido Principal -->
        <main class="main-content">
            <header class="main-header">
                <h1>Panel de Reportes y Estadísticas</h1>
            </header>

            <!-- Pestañas de Navegación de Reportes -->
            <nav class="report-tabs">
                <button class="tab-btn active" data-report="sales-period">Ventas por Periodo</button>
                <button class="tab-btn" data-report="sales-employee">Por Empleado</button>
                <button class="tab-btn" data-report="top-products">Más Vendidos</button>
                <button class="tab-btn" data-report="inventory-shrinks">Mermas</button>
                <button class="tab-btn" data-report="cashback">Cashback</button>
                <button class="tab-btn" data-report="attendance">Asistencia</button>
                <button class="tab-btn" data-report="payment-methods">Método de Pago</button>
            </nav>

            <!-- Contenedor de la tabla -->
            <section class="report-results-container">
                <h2 id="reportTitle">Reporte de Ventas por Periodo</h2>
                <div class="table-responsive">
                    <table id="reportTable">
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <script src="reports.js" type="module"></script>
</body>
</html>
