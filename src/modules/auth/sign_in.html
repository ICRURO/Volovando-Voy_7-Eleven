<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Volovando Voy - Crear Cuenta</title>
    
    <!-- RUTA EXACTA AL CSS -->
    <link rel="stylesheet" href="/Log_in/logs_css/sign_in.css">
</head>
<body>

    <!-- Menú lateral -->
    <aside class="sidebar">
        <div class="brand-title">
            VOLOVANDO<br>VOY
        </div>
        
        <!-- RUTA EXACTA A LA IMAGEN -->
        <img src="/img/mascota.png" alt="Mascota Volován" class="sidebar-logo">

        <nav class="nav-menu">
            <a href="#">HOME</a>
            <a href="#">MENÚ</a>
            <a href="#">PEDIDOS</a>
            <a href="#">CLIENTES</a>
            <a href="#">INVENTARIO</a>
            <a href="#">CONFIG</a>
        </nav>
    </aside>

    <!-- Tarjeta del formulario -->
    <main class="main-content">
        <section class="form-card">
            <div class="cashback-badge">
                ¡Gana cashback en cada compra!
            </div>

            <h1 class="card-title">CREAR CUENTA</h1>
            <p class="subtitle">Regístrate para acumular cashback en tus volovanes.</p>

            <form id="registroForm">
                <div class="form-group">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ej. usuario@correo.com" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" minlength="8" required>
                    <span class="field-hint">Mínimo 8 carácteres</span>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit" id="btnRegistrar">REGISTRARME Y COMENZAR</button>

                <p id="mensajeError" class="msg-error"></p>
                <p id="mensajeExito" class="msg-success"></p>

                <div class="login-footer-link">
                    ¿Ya tienes una cuenta registrada? <a href="/login" id="linkLogin">Iniciar sesión</a>
                </div>
            </form>
        </section>
    </main>

    <!-- RUTA EXACTA AL JS -->
    <script src="/Log_in/logs_JS/sign_in.js"></script>
</body>
</html>
