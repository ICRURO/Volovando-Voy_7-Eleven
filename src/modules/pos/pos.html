<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Punto de Venta</title>
  <link rel="stylesheet" href="../../../assets/css/global.css">
  <link rel="stylesheet" href="pos.css">
</head>
<body>
  <div class="pos-container">
    <main class="catalog">
      <h2>CATÁLOGO DE PRODUCTOS</h2>

      <div class="search-bar">
        <input type="text" id="search" placeholder="Buscar producto...">
      </div>

      <div class="category-tabs">
        <button class="tab-btn active" data-category="salados">SALADOS</button>
        <button class="tab-btn" data-category="dulces">DULCES</button>
      </div>

      <div class="grid-productos product-grid" id="product-grid">
      </div>
    </main>

    <aside class="ticket">
      <h2>DETALLE DEL TICKET</h2>

      <div class="client-search">
        <label>CLIENTE ASOCIADO:</label>
        <input type="text" id="client-search" placeholder="Buscar por ID (ej. CLI-001)...">
        <span id="client-name">-- Sin cliente asociado --</span>
      </div>

      <div class="sale-type">
        <label>TIPO DE VENTA:</label>
        <div class="radio-options">
          <label><input type="radio" name="tipo-venta" value="mostrador" checked> Mostrador</label>
          <label><input type="radio" name="tipo-venta" value="domicilio"> Domicilio</label>
        </div>
      </div>

      <div class="ticket-items" id="ticket-items">
      </div>

      <div class="ticket-totals">
        <div class="total-row">
          <span>SUBTOTAL:</span>
          <span id="subtotal">$0.00</span>
        </div>
        <div class="total-row grand-total">
          <span>TOTAL A PAGAR:</span>
          <span id="total">$0.00</span>
        </div>
        <button id="btn-pay" class="btn-pay">PROCEDER AL PAGO</button>
      </div>
    </aside>
  </div>

  <script type="module" src="pos.js"></script>
</body>
</html>
