<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenida</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f3ed;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .welcome-card {
            background-color: white;
            padding: 50px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        .welcome-card h2 {
            color: #8b1818;
            margin-bottom: 10px;
            font-size: 2rem;
        }
        .welcome-card p {
            font-size: 1.1rem;
            color: #666;
            line-height: 1.5;
        }
        .illustration {
            width: 120px;
            margin-bottom: 20px;
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="welcome-card">
        <!-- Puedes poner aquí otra imagen o repetir a volovino -->
        <img src="../assets/volovino.png" alt="Bienvenida" class="illustration">
        <h2>¡Bienvenido al sistema!</h2>
        <p>Has iniciado sesión correctamente en <b>Volovando Voy</b>.</p>
        <p>Por favor, selecciona un módulo en el menú lateral de la izquierda para comenzar a trabajar.</p>
    </div>

</body>
</html>
